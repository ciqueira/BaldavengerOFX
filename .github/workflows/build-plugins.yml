name: Build Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin para build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hueconverge
          - videograde
          - freqsep
          - filmgrade
          - freqeq
          - matrix
          - qualifier
          - replace
          - resolvemath
          - resolvemathxtra
          - scan
          - softclip
      target:
        description: 'Alvo do build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - macos
      description:
        description: 'Descricao do release (opcional)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Marcar como pre-release (beta)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.matrix.outputs.plugins }}
      target: ${{ steps.matrix.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Plugins
        id: matrix
        shell: bash
        env:
          INPUT_PLUGIN: ${{ github.event.inputs.plugin }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail

          PLUGINS='[]'

          add_plugin() {
            local key="$1"
            local dir="$2"
            local name="$3"
            local mac_gpu="${4:-METAL}"
            local mac_family="${5:-METAL}"
            local display_name="PD - $name"
            local entitlement="download:$key"
            local version_file="$dir/VERSION"
            local version

            if [ ! -f "$version_file" ]; then
              echo "Erro: arquivo VERSION nao encontrado para $name em $version_file." >&2
              exit 1
            fi

            version=$(tr -d '[:space:]' < "$version_file")
            version="${version#v}"

            if [ -z "$version" ]; then
              echo "Erro: arquivo VERSION vazio para $name em $version_file." >&2
              exit 1
            fi

            PLUGINS=$(jq -c \
              --arg key "$key" \
              --arg dir "$dir" \
              --arg name "$name" \
              --arg mac_gpu "$mac_gpu" \
              --arg mac_family "$mac_family" \
              --arg display_name "$display_name" \
              --arg entitlement "$entitlement" \
              --arg version "$version" \
              '. + [{
                key: $key,
                dir: $dir,
                name: $name,
                mac_gpu: $mac_gpu,
                display_name: $display_name,
                entitlement: $entitlement,
                version: $version,
                vcxproj: ($dir + "/" + $name + "Plugin.vcxproj"),
                solution: ($dir + "/" + $name + "Plugin.sln"),
                mac_bundle: ("BaldavengerPlugins" + $mac_family + "_DR17/" + $name + ".macOS.DR17." + $mac_gpu + ".ofx.bundle"),
                windows_bundle: ($dir + "/x64/Release/" + $name + ".ofx.bundle")
              }]' <<< "$PLUGINS")
          }

          add_known_plugin() {
            case "$1" in
              hueconverge)
                add_plugin hueconverge HueConverge HueConverge
                ;;
              videograde)
                add_plugin videograde VideoGrade VideoGrade
                ;;
              freqsep)
                add_plugin freqsep FreqSep FreqSep
                ;;
              filmgrade)
                add_plugin filmgrade FilmGrade FilmGrade
                ;;
              freqeq)
                add_plugin freqeq FreqEQ FreqEQ
                ;;
              matrix)
                add_plugin matrix Matrix Matrix
                ;;
              qualifier)
                add_plugin qualifier Qualifier Qualifier
                ;;
              replace)
                add_plugin replace Replace Replace
                ;;
              resolvemath)
                add_plugin resolvemath ResolveMath ResolveMath CPU CPU
                ;;
              resolvemathxtra)
                add_plugin resolvemathxtra ResolveMathxtra ResolveMathxtra CPU CPU
                ;;
              scan)
                add_plugin scan Scan Scan
                ;;
              softclip)
                add_plugin softclip SoftClip SoftClip
                ;;
              *)
                echo "Unknown plugin: $1" >&2
                exit 1
                ;;
            esac
          }

          case "${INPUT_PLUGIN:-all}" in
            all)
              add_known_plugin hueconverge
              add_known_plugin videograde
              add_known_plugin freqsep
              add_known_plugin filmgrade
              add_known_plugin freqeq
              add_known_plugin matrix
              add_known_plugin qualifier
              add_known_plugin replace
              add_known_plugin resolvemath
              add_known_plugin resolvemathxtra
              add_known_plugin scan
              add_known_plugin softclip
              ;;
            hueconverge|videograde|freqsep|filmgrade|freqeq|matrix|qualifier|replace|resolvemath|resolvemathxtra|scan|softclip)
              add_known_plugin "$INPUT_PLUGIN"
              ;;
            *)
              echo "Invalid plugin input: ${INPUT_PLUGIN:-}" >&2
              exit 1
              ;;
          esac

          TARGET="${INPUT_TARGET:-both}"

          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.plugin.name }})
    needs: prepare
    if: |
      needs.prepare.outputs.plugins != '[]' &&
      (needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'macos')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Plugin
        run: |
          cd "${{ matrix.plugin.dir }}"
          make INSTALL_PLUGIN=FALSE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin.name }}-macOS
          path: ${{ matrix.plugin.mac_bundle }}
          retention-days: 1

  build-windows:
    name: Build Windows (${{ matrix.plugin.name }})
    needs: prepare
    if: |
      needs.prepare.outputs.plugins != '[]' &&
      (needs.prepare.outputs.target == 'both' || needs.prepare.outputs.target == 'windows')
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "opencl", "visual_studio_integration"]'

      - name: Install CUDA MSBuild Integration
        shell: pwsh
        run: |
          $cudaMsbuild = Join-Path $env:CUDA_PATH 'extras\visual_studio_integration\MSBuildExtensions'
          if (!(Test-Path $cudaMsbuild)) {
            Write-Error "CUDA MSBuild extensions not found at $cudaMsbuild"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsInstall) {
            Write-Error 'Visual Studio installation with VC tools was not found.'
          }

          $vcMsbuildRoot = Join-Path $vsInstall 'MSBuild\Microsoft\VC'
          $vcVersionDirs = Get-ChildItem $vcMsbuildRoot -Directory -Filter 'v*'
          if (!$vcVersionDirs) {
            Write-Error "No VC MSBuild version directories found at $vcMsbuildRoot"
          }

          foreach ($vcVersionDir in $vcVersionDirs) {
            $buildCustomizations = Join-Path $vcVersionDir.FullName 'BuildCustomizations'
            New-Item -ItemType Directory -Force -Path $buildCustomizations | Out-Null
            Copy-Item (Join-Path $cudaMsbuild 'CUDA 12.4.props') $buildCustomizations -Force
            Copy-Item (Join-Path $cudaMsbuild 'CUDA 12.4.targets') $buildCustomizations -Force
            Copy-Item (Join-Path $cudaMsbuild 'CUDA 12.4.xml') $buildCustomizations -Force
            Copy-Item (Join-Path $cudaMsbuild 'Nvda.Build.CudaTasks.v12.4.dll') $buildCustomizations -Force
          }

      - name: Configure CUDA Version in Project File
        shell: pwsh
        run: |
          $project = '${{ matrix.plugin.vcxproj }}'
          (Get-Content $project -Raw) -replace 'CUDA 11.0', 'CUDA 12.4' | Set-Content $project -NoNewline

      - name: Build Plugin
        run: |
          msbuild ${{ matrix.plugin.solution }} /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        env:
          CUDA_INC_PATH: ${{ env.CUDA_PATH }}\include
          CUDA_LIB_PATH: ${{ env.CUDA_PATH }}\lib\x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin.name }}-Windows
          path: ${{ matrix.plugin.windows_bundle }}
          retention-days: 1

  release-github:
    name: Release to GitHub
    needs: [prepare, build-macos, build-windows]
    if: |
      always() &&
      needs.prepare.outputs.plugins != '[]' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-macOS'
          path: macos-artifacts

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows'
          path: windows-artifacts

      - name: Prepare ZIP Files
        id: package
        env:
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=()
          manifest='{"schemaVersion":1,"assets":{}}'

          plugin_field() {
            local plugin_name="$1"
            local field="$2"

            jq -r \
              --arg name "$plugin_name" \
              --arg field "$field" \
              'map(select(.name == $name))[0][$field] // empty' <<< "$PLUGINS_JSON"
          }

          add_manifest_asset() {
            local zip_name="$1"
            local plugin_name="$2"
            local display_name
            local entitlement

            display_name=$(plugin_field "$plugin_name" display_name)
            entitlement=$(plugin_field "$plugin_name" entitlement)

            if [ -z "$display_name" ] || [ -z "$entitlement" ]; then
              echo "Erro: metadados do manifest nao encontrados para $plugin_name." >&2
              exit 1
            fi

            manifest=$(jq -c \
              --arg zip_name "$zip_name" \
              --arg display_name "$display_name" \
              --arg entitlement "$entitlement" \
              '.assets[$zip_name] = {
                displayName: $display_name,
                requiredEntitlements: [$entitlement]
              }' <<< "$manifest")
          }

          for artifact_dir in macos-artifacts/*-macOS; do
            plugin_name=$(basename "$artifact_dir" -macOS)
            mac_gpu=$(jq -r --arg name "$plugin_name" 'map(select(.name == $name))[0].mac_gpu // "METAL"' <<< "$PLUGINS_JSON")
            version=$(plugin_field "$plugin_name" version)
            bundle_name="${plugin_name}.macOS.DR17.${mac_gpu}.ofx.bundle"
            zip_name="${plugin_name}-macOS-${version}.zip"

            mv "$artifact_dir" "$bundle_name"
            zip -r "$zip_name" "$bundle_name"
            rm -rf "$bundle_name"
            files+=("$zip_name")
            add_manifest_asset "$zip_name" "$plugin_name"
          done

          for artifact_dir in windows-artifacts/*-Windows; do
            plugin_name=$(basename "$artifact_dir" -Windows)
            version=$(plugin_field "$plugin_name" version)
            bundle_name="${plugin_name}.ofx.bundle"
            zip_name="${plugin_name}-Windows-${version}.zip"

            mv "$artifact_dir" "$bundle_name"
            zip -r "$zip_name" "$bundle_name"
            rm -rf "$bundle_name"
            files+=("$zip_name")
            add_manifest_asset "$zip_name" "$plugin_name"
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Erro: Nenhum artefato encontrado para upload. Abortando release."
            exit 1
          fi

          jq . <<< "$manifest" > manifest.json
          files+=("manifest.json")

          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Release Tag
        run: |
          set -euo pipefail

          git tag -f pd-latest "$GITHUB_SHA"
          git push --force origin refs/tags/pd-latest

      - name: Determine Release Notes
        id: release_notes
        env:
          MANUAL_DESC: ${{ github.event.inputs.description }}
        run: |
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$MANUAL_DESC" ]; then
            echo "$MANUAL_DESC" >> "$GITHUB_OUTPUT"
          else
            echo "Release gerado manualmente." >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PD_TOKEN }}
          tag_name: pd-latest
          name: Baldavenger Plugins
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: ${{ steps.package.outputs.files }}
          overwrite_files: true
          make_latest: true
